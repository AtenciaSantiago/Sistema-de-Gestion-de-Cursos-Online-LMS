<div class="page-head">
  <h1>Usuarios</h1>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()">
    <mat-icon>person_add</mat-icon>
    Nuevo usuario
  </button>
</div>

@if (loading()) {
  <div class="loading"><mat-spinner /></div>
} @else {
  <div class="filtros">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Buscar por nombre, correo o rol</mat-label>
      <input matInput (input)="buscar($any($event.target).value)" />
    </mat-form-field>
  </div>
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="nombre_usuario">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let u">{{ u.nombre_usuario }}</td>
      </ng-container>
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Correo</th>
        <td mat-cell *matCellDef="let u">{{ u.email }}</td>
      </ng-container>
      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef>Rol</th>
        <td mat-cell *matCellDef="let u">{{ u.rol }}</td>
      </ng-container>
      <ng-container matColumnDef="activo">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let u">
          <span class="estado" [class.ACTIVA]="u.activo" [class.CANCELADA]="!u.activo">{{ u.activo ? 'Activo' : 'Inactivo' }}</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="fecha_creacion">
        <th mat-header-cell *matHeaderCellDef>Creado</th>
        <td mat-cell *matCellDef="let u">{{ u.fecha_creacion | date: 'dd/MM/yyyy' }}</td>
      </ng-container>
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let u" class="actions">
          <button mat-icon-button type="button" (click)="editar(u)" matTooltip="Editar" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          @if (u.id_usuario !== miId) {
            <button
              mat-icon-button
              type="button"
              (click)="cambiarActivo(u)"
              [matTooltip]="u.activo ? 'Desactivar usuario' : 'Activar usuario'"
              [attr.aria-label]="u.activo ? 'Desactivar usuario' : 'Activar usuario'"
            >
              <mat-icon>{{ u.activo ? 'person_off' : 'person' }}</mat-icon>
            </button>
            <button mat-icon-button type="button" (click)="eliminar(u)" matTooltip="Eliminar" aria-label="Eliminar">
              <mat-icon>delete</mat-icon>
            </button>
          }
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let fila; columns: displayedColumns"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons />
  </div>
}
