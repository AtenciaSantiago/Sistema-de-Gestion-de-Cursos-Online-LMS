<div class="page-head">
  <h1>Categorías</h1>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()">
    <mat-icon>add</mat-icon>
    Nueva categoría
  </button>
</div>

@if (loading()) {
  <div class="loading"><mat-spinner /></div>
} @else if (dataSource.data.length === 0) {
  <div class="vacio mat-elevation-z1">
    <mat-icon>category</mat-icon>
    <p>Todavía no hay categorías. Cree la primera para poder registrar cursos.</p>
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="nombre_categoria">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let c">{{ c.nombre_categoria }}</td>
      </ng-container>

      <ng-container matColumnDef="fecha_creacion">
        <th mat-header-cell *matHeaderCellDef>Creada</th>
        <td mat-cell *matCellDef="let c">{{ c.fecha_creacion | date: 'dd/MM/yyyy' }}</td>
      </ng-container>

      <!-- Solo el Admin edita o elimina -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let c" class="actions">
          <button mat-icon-button type="button" (click)="editar(c)" matTooltip="Editar" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="eliminar(c)" matTooltip="Eliminar" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let fila; columns: displayedColumns"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons />
  </div>
}
