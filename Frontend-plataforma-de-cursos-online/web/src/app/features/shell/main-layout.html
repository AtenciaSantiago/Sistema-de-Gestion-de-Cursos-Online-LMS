<mat-sidenav-container
  #sidenavShell="matSidenavContainer"
  class="shell"
  autosize
>
  <mat-sidenav
    #sidenav
    [mode]="esMovil() ? 'over' : 'side'"
    [opened]="!esMovil()"
    class="nav-rail"
    [class.collapsed]="sidebarCollapsed() && !esMovil()"
  >
    <div class="nav-brand">
      <div class="nav-brand__mark">
        <mat-icon class="nav-brand__icon">school</mat-icon>
      </div>
      @if (!sidebarCollapsed()) {
        <div class="nav-brand__text">
          <span class="nav-brand__title">Campus Digital</span>
          <span class="nav-brand__sub">Cursos en línea</span>
        </div>
      }
    </div>
    <mat-nav-list class="nav-list">
      @for (item of nav; track item.path) {
        <a
          mat-list-item
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="active-link"
          (click)="cerrarSiMovil()"
          [matTooltip]="sidebarCollapsed() ? item.label : ''"
          matTooltipPosition="right"
          [matTooltipDisabled]="!sidebarCollapsed()"
        >
          <mat-icon matListItemIcon class="nav-item__icon">{{ item.icon }}</mat-icon>
          <span matListItemTitle class="nav-label">{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
    <div class="nav-footer">
      <button
        mat-stroked-button
        type="button"
        class="collapse-btn"
        (click)="toggleSidebar()"
        [matTooltip]="sidebarCollapsed() ? 'Expandir menú' : 'Colapsar menú'"
        matTooltipPosition="right"
      >
        <mat-icon>{{ sidebarCollapsed() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
        @if (!sidebarCollapsed()) {
          <span>Ocultar menú</span>
        }
      </button>
    </div>
  </mat-sidenav>
  <mat-sidenav-content class="main-column">
    <mat-toolbar class="top-bar">
      <button
        mat-icon-button
        type="button"
        class="menu-toggle"
        (click)="toggleSidebar()"
        aria-label="Alternar menú lateral"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <span class="title">{{ rolActual === 'Estudiante' ? 'Mi campus' : 'Panel de ' + rolActual }}</span>
      <span class="spacer"></span>

      <!-- Entregable 2: nombre y rol de quien inició sesión -->
      <span class="usuario-sesion">
        <mat-icon>account_circle</mat-icon>
        <span>{{ nombreUsuario }} · {{ rolActual }}</span>
      </span>
      
      <button mat-icon-button type="button" (click)="logout()" aria-label="Cerrar sesión" matTooltip="Cerrar sesión">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>
    <main class="content">
      <div class="content-inner">
        <router-outlet />
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
